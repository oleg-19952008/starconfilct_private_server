// config for dedicated server

// нужно чтобы на сервере fps был 30 (кратно sv_updateRate=15), но так как он получается чуть меньше чем cl_maxFps, то выставим cvar слегка побольше
set cl_maxFps 32

// lua почти не используем - нет необходимости в значительном GC
set script_gcWorkBudget 0

set s_masterVolume 0
set script_initRemoteDebugger 0
set ship_controlForceMode -1

// not need any async working
set tm_enable 0

set ssh_port 2222

set ai_logSquads 5

set ai_convoyDefendRadius 300

//Время сбора лута
set sv_lootCrateScanTime 3
//Расстояние прицеливания различными патрулями
set ai_kiteDistance 5000


exec dediserver_local.cfg